{{- if and .Values.database.enabled (not .Values.database.auth.existingSecret) }}
{{- $host := include "hermes.postgresql.fullname" . -}}
{{- $port := .Values.database.service.port | int -}}
{{- $user := .Values.database.auth.username | urlquery | replace "+" "%20" -}}
{{- $password := required "database.auth.password обязателен, если не задан database.auth.existingSecret" .Values.database.auth.password | urlquery | replace "+" "%20" -}}
{{- $database := .Values.database.auth.database | urlquery | replace "+" "%20" -}}
{{- $sslMode := .Values.database.auth.sslMode | default "disable" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes.database.secretName" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  {{ .Values.database.auth.usernameKey | default "username" }}: {{ .Values.database.auth.username | quote }}
  {{ .Values.database.auth.passwordKey | default "password" }}: {{ .Values.database.auth.password | quote }}
  {{ .Values.database.auth.databaseKey | default "database" }}: {{ .Values.database.auth.database | quote }}
  {{ .Values.database.auth.urlKey | default "DATABASE_URL" }}: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=%s" $user $password $host $port $database $sslMode | quote }}
{{- end }}
