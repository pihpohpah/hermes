[tools]
go = "1.27.3"
"npm:esbuild" = "0.25.11"

[env]
_.file = ".env"

[tasks.bootstrap]
run = """
if [ ! -f .env ]; then
  cp .env.example .env
  echo "Created .env from .env.example"
else
  echo ".env already exists"
fi
go mod download
"""

[tasks.dev]
description = "Собрать фронтенд, поднять Postgres, применить миграции, наполнить БД (seed + погода в mock), запустить сервер"
depends = ["bootstrap", "assets", "db-up", "migrate-up", "data-load"]
run = """
#!/usr/bin/env bash
set -euo pipefail
echo "Сервер: http://localhost:${PORT:-8080}"
if command -v air >/dev/null 2>&1; then
  exec air -c .air.toml
else
  exec go run ./cmd/server listen
fi
"""

[tasks.db-up]
description = "Поднять PostgreSQL (PostGIS) в Docker, если ещё не работает"
run = """
#!/usr/bin/env bash
set -euo pipefail
CONTAINER="${POSTGRES_CONTAINER:-postgres-1}"
if [ -n "$(docker ps -q --filter "name=^${CONTAINER}$")" ]; then
  echo "Контейнер $CONTAINER уже работает"
  exit 0
fi
docker rm -f "$CONTAINER" 2>/dev/null || true
docker run -d --name "$CONTAINER" \
  -e POSTGRES_DB="${POSTGRES_DB:-hermes}" \
  -e POSTGRES_USER="${POSTGRES_USER:-postgres}" \
  -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-postgres}" \
  -p "${POSTGRES_PORT:-5432}:5432" \
  postgis/postgis:15-3.4
for _ in $(seq 1 30); do
  docker exec "$CONTAINER" pg_isready -U "${POSTGRES_USER:-postgres}" -q && { echo "Postgres готов"; exit 0; }
  sleep 1
done
echo "Postgres не поднялся за 30 с"
exit 1
"""

[tasks.data-load]
description = "Сид-места + погода в mock-режиме (без сети) + оценка условий"
run = """
#!/usr/bin/env bash
set -euo pipefail
go run ./cmd/server seed
WEATHER_MODE=mock go run ./cmd/server weather_load
go run ./cmd/server conditions_assess
"""

[tasks.assets]
description = "Собрать и минифицировать JS-бандл и CSS (esbuild)"
run = """
#!/usr/bin/env bash
set -euo pipefail
esbuild web/static/js/app/app.js \
  --bundle --minify --format=esm \
  --outfile=web/static/js/app/app.min.js
echo "OK: web/static/js/app/app.min.js ($(du -h web/static/js/app/app.min.js | cut -f1))"
esbuild web/static/css/app.css \
  --minify \
  --outfile=web/static/css/app.min.css
echo "OK: web/static/css/app.min.css ($(du -h web/static/css/app.min.css | cut -f1))"
"""

[tasks.assets-watch]
description = "Пересобирать JS-бандл и CSS при изменении исходников (esbuild --watch)"
run = """
#!/usr/bin/env bash
set -euo pipefail
esbuild web/static/js/app/app.js \
  --bundle --minify --format=esm \
  --outfile=web/static/js/app/app.min.js \
  --watch &
js_pid=$!
esbuild web/static/css/app.css \
  --minify \
  --outfile=web/static/css/app.min.css \
  --watch &
css_pid=$!
trap 'kill $js_pid $css_pid 2>/dev/null || true' EXIT INT TERM
wait
"""

[tasks.migrate-up]
description = "Применить идемпотентные SQL-миграции в PostgreSQL"
run = """
#!/usr/bin/env bash
set -euo pipefail
DB_NAME="${POSTGRES_DB:-hermes}"
DB_USER="${POSTGRES_USER:-postgres}"
CONTAINER="${POSTGRES_CONTAINER:-postgres-1}"
for f in migrations/*.sql; do
  echo "== $f"
  docker exec -i "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 < "$f"
done
"""

[tasks.migrate-down]
description = "Откатить SQL-миграции в PostgreSQL"
run = """
#!/usr/bin/env bash
set -euo pipefail
DB_NAME="${POSTGRES_DB:-hermes}"
DB_USER="${POSTGRES_USER:-postgres}"
CONTAINER="${POSTGRES_CONTAINER:-postgres-1}"
docker exec -i "$CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
DROP TABLE IF EXISTS collection_items;
DROP TABLE IF EXISTS collections;
DROP TABLE IF EXISTS pin_reports;
DROP TABLE IF EXISTS pin_goings;
DROP TABLE IF EXISTS pins;
DROP TABLE IF EXISTS pin_kinds;
DROP TABLE IF EXISTS events;
DROP TABLE IF EXISTS event_categories;
DROP TABLE IF EXISTS reports;
DROP TABLE IF EXISTS conditions_cache;
DROP TABLE IF EXISTS weather_source_status;
DROP TABLE IF EXISTS weather_observations;
DROP TABLE IF EXISTS trips;
DROP TABLE IF EXISTS place_sources;
DROP TABLE IF EXISTS places;
DROP TABLE IF EXISTS place_categories;
DROP TABLE IF EXISTS place_layers;
DROP TABLE IF EXISTS idempotency_keys;
DROP TABLE IF EXISTS user_sessions;
DROP TABLE IF EXISTS user_identities;
DROP TABLE IF EXISTS users;
SQL
"""

[tasks.seed]
description = "Наполнить БД тестовыми местами вокруг Владивостока (43.1155, 131.8855)"
run = "go run ./cmd/server seed"

[tasks.weather-load]
description = "Загрузить почасовую погоду Open-Meteo для seed-мест (WEATHER_MODE=real|mock)"
run = "go run ./cmd/server weather_load"

[tasks.conditions-assess]
description = "Оценить условия для мест (эвристики) за сегодня: ACTIVITY=walk,sup,hike,run, PLACE=<uuid>"
run = """
#!/usr/bin/env bash
set -euo pipefail
args=()
if [ -n "${DATE:-}" ]; then args+=(-day "$DATE"); fi
if [ -n "${ACTIVITY:-}" ]; then args+=(-activity "$ACTIVITY"); fi
if [ -n "${PLACE:-}" ]; then args+=(-place "$PLACE"); fi
go run ./cmd/server conditions_assess "${args[@]}"
"""

[tasks.elevations-enrich]
description = "Заполнить высоты точек через Open-Meteo elevation (нужно для горной погоды)"
run = """
#!/usr/bin/env bash
set -euo pipefail
args=()
if [ -n "${PLACE:-}" ]; then args+=(-place "$PLACE"); fi
if [ -n "${OVERWRITE:-}" ]; then args+=(-overwrite); fi
go run ./cmd/server elevations_enrich "${args[@]}"
"""

[tasks.coverage-probe]
description = "Показать, какие данные реально приходят и какие точки делят одну ячейку модели"
run = """
#!/usr/bin/env bash
set -euo pipefail
args=()
if [ -n "${DATE:-}" ]; then args+=(-day "$DATE"); fi
if [ -n "${PLACE:-}" ]; then args+=(-place "$PLACE"); fi
go run ./cmd/server coverage_probe "${args[@]}"
"""

[tasks.map-relief]
description = "Собрать офлайн-рельеф (hillshade) Приморского края в PMTiles"
run = "./scripts/map/build-relief.sh"

[tasks.map-relief-local]
description = "Собрать рельеф только для агломерации Владивостока (быстро)"
run = """
#!/usr/bin/env bash
set -euo pipefail
RELIEF_BBOX="${RELIEF_BBOX:-131.7,42.95,132.2,43.35}" \
RELIEF_MINZOOM="${RELIEF_MINZOOM:-10}" RELIEF_MAXZOOM="${RELIEF_MAXZOOM:-13}" \
  ./scripts/map/build-relief.sh
"""

[tasks.map-download]
description = "Собрать офлайн-карту Приморского края (PMTiles, z0-15) из OSM"
run = "./scripts/map/build-map.sh"

[tasks.map-size]
description = "Показать размер собранного архива карты"
run = """
#!/usr/bin/env bash
set -euo pipefail
f="${MAP_OUTPUT:-web/static/pmtiles/primorsky-krai-z15.pmtiles}"
if [ ! -f "$f" ]; then
  echo "Архив не собран: $f"
  echo "Запустите: mise run map-download"
  exit 1
fi
du -h "$f"
"""

[tasks.map-serve]
description = "Карта с двумя режимами (город/природа) на :8080, без Postgres"
run = "go run ./cmd/mapserver -addr :8080"

[tasks.map-check]
description = "Проверить, что эндпоинт архива отвечает байтовыми диапазонами"
run = """
#!/usr/bin/env bash
set -euo pipefail
url="${MAP_URL:-http://127.0.0.1:8080}/api/map/region.pmtiles"
code=$(curl -s -o /tmp/hermes-map-range.bin -w '%{http_code}' -r 0-1023 "$url")
bytes=$(wc -c < /tmp/hermes-map-range.bin | tr -d ' ')
magic=$(head -c 7 /tmp/hermes-map-range.bin)
echo "HTTP $code, получено байт: $bytes, магия: $magic"
[ "$code" = "206" ] || { echo "Ожидался 206 Partial Content"; exit 1; }
[ "$bytes" = "1024" ] || { echo "Ожидалось ровно 1024 байта"; exit 1; }
[ "$magic" = "PMTiles" ] || { echo "Неверная сигнатура архива"; exit 1; }
echo "OK: Range-запросы и архив в порядке"
"""
