services:
  db:
    image: postgis/postgis:18-3.6-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-hermes}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hermes}"
      POSTGRES_DB: "${POSTGRES_DB:-hermes}"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - hermes

  api:
    image: "${HERMES_IMAGE:-ghcr.io/pihpohpah/hermes}:${HERMES_TAG:-latest}"
    pull_policy: "${PULL_POLICY:-always}"
    restart: unless-stopped
    command: ["listen"]
    depends_on:
      db:
        condition: service_healthy
    # Секреты и прикладные настройки (TELEGRAM_BOT_TOKEN, OPENMETEO_API_KEY,
    # SENTRY_DSN, ...) — в .env на сервере (mode 0600), скрипт его не копирует.
    env_file:
      - .env
    environment:
      TZ: "${TZ:-Asia/Vladivostok}"
      APP_ENV: "${APP_ENV:-prod}"
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:-hermes}@db:5432/${POSTGRES_DB:-hermes}"
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    volumes:
      # Загруженные пользователями фото переживают пересоздание контейнера.
      - uploads:/app/web/static/uploads
      # Офлайн-карты (PMTiles) собираются отдельно (mise run map-download /
      # map-relief) и кладутся на сервер в ./web/static/pmtiles рядом с compose.yaml.
      - ./web/static/pmtiles:/app/web/static/pmtiles:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - hermes

  console:
    image: "${HERMES_IMAGE:-ghcr.io/pihpohpah/hermes}:${HERMES_TAG:-latest}"
    pull_policy: "${PULL_POLICY:-always}"
    restart: unless-stopped
    profiles: ["console"]
    entrypoint: ["sleep", "infinity"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: "${TZ:-Asia/Vladivostok}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:-hermes}@db:5432/${POSTGRES_DB:-hermes}"
    volumes:
      - uploads:/app/web/static/uploads
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - hermes

volumes:
  db_data:
  uploads:

networks:
  hermes:
    driver: bridge
