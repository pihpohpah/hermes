version: "2"
linters:
  default: all
  disable:
    # strange
    - tagliatelle
    - wrapcheck
    - durationcheck
    # debatable
    - depguard
    - dupl
    - err113
    - exhaustruct
    - exhaustruct_v5
    - gomodguard # deprecated in golangci-lint 2.12, no module blocklist
    - funlen
    - goconst
    - gocyclo
    - godot
    - godox
    - gosec
    - ireturn
    - maintidx
    - nilnil
    - noctx
    - nonamedreturns
    - paralleltest
    - tagalign
    - tagliatelle
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5
    - noinlineerr
    - embeddedstructfieldcheck
    - nolintlint
    - godoclint
    # other reasons
    - cyclop   # gocognit  do the same
    - funlen   # gocognit  do the same
    - err113   # errorlint do the same
    - gocyclo  # gocognit  do the same
    - maintidx # gocognit  do the same
  settings:
    mnd:
      # profiles.go is a declarative tuning table: every number is a policy
      # constant whose meaning is the field name it is assigned to.
      ignored-files:
        - internal/domain/scoring/profiles.go
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
    modernize:
      disable:
        # Suggests `Field: {` for embedded structs; the compiler still wants the type.
        - embedlit
  exclusions:
    paths:
      - ^docs/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
    - golines
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^docs/
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    golines:
      reformat-tags: false
      max-len: 120
    gofumpt:
      module-path: github.com/pihpohpah/hermes
